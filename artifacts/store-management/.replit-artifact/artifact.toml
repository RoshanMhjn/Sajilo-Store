kind = "web"
previewPath = "/"
title = "AI Supermarket Store Management"
version = "1.0.0"
id = "artifacts/store-management"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20371

[services.development]
run = "pnpm --filter @workspace/store-management run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/store-management", "run", "build" ]
publicDir = "artifacts/store-management/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20371"
BASE_PATH = "/"
